name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build & Type-Check Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-Check (TypeScript)
        run: npx tsc --noEmit

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== Step 1: Loading environment ==="
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            if [ -s "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
            fi
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin"

            echo "=== Step 2: Navigating to project directory ==="
            cd /var/www/zien/University-library-platform-backend

            echo "=== Step 3: Fetching and resetting to origin/main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Step 4: Installing dependencies ==="
            npm install --prefer-offline --no-audit

            echo "=== Step 5: Syncing Prisma Schema with Database ==="
            npx prisma generate
            npx prisma db push --accept-data-loss

            echo "=== Step 6: Building backend distribution ==="
            npm run build

            echo "=== Step 7: Restarting server via PM2 ==="
            pm2 restart zien-backend || pm2 start dist/index.js --name zien-backend
            pm2 save

            echo "=== Deployment Successfully Finished! ==="
