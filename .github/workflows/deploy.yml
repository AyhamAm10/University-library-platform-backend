name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build & Type-Check Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-Check (TypeScript)
        run: npx tsc --noEmit

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            # 1. Ensure NVM / Node / PM2 environments are loaded in non-interactive shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin"

            echo "=== Step 1: Navigating to project directory ==="
            cd /var/www/zien/University-library-platform-backend

            echo "=== Step 2: Pulling latest changes from main ==="
            git pull origin main

            echo "=== Step 3: Installing dependencies ==="
            npm install

            echo "=== Step 4: Syncing Prisma Schema with Database ==="
            npx prisma generate
            npx prisma db push

            echo "=== Step 5: Building backend distribution ==="
            npm run build

            echo "=== Step 6: Restarting server via PM2 ==="
            pm2 reload zien-backend || pm2 restart zien-backend
            pm2 save

            echo "=== Deployment Successfully Finished! ==="
